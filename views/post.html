<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blog BacHub" />
  <title>Articol — BacHub</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/romana.css" />
  <link rel="stylesheet" href="/css/blog.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="page-hero">
    <div class="hero-inner">
      <div class="hero-top">
        <span class="logo"><a href="/" style="color:white;text-decoration:none;">BacHub</a></span>
        <nav class="nav">
          <a href="/">Acasă</a>
          <a href="/romana">Română</a>
          <a href="/istorie">Istorie</a>
          <a href="/blog" class="active">Blog</a>
          <a href="/despre">Despre</a>
        </nav>
      </div>
      <div class="opera-hero-content">
        <a href="/blog" class="back-link">← Înapoi la Blog</a>
        <h1 class="hero-title" id="post-title">Se încarcă...</h1>
        <p class="hero-subtitle" id="post-meta"></p>
      </div>
    </div>
  </header>

  <!-- AD SLOT TOP -->
  <div class="container" style="padding-top: 32px;">
    <div class="ad-slot"><span>Publicitate</span></div>
  </div>

  <!-- POST CONTENT -->
  <section class="section">
    <div class="container">
      <div class="post-layout">
        <div class="post-content" id="post-content">
          <div class="loading">Se încarcă articolul...</div>
        </div>
      </div>
    </div>
  </section>

  <!-- AD SLOT BOTTOM -->
  <div class="container">
    <div class="ad-slot"><span>Publicitate</span></div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <span class="logo">BacHub</span>
      <p>© 2025 BacHub · Toate drepturile rezervate</p>
      <nav class="footer-nav">
        <a href="/despre">Despre</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
