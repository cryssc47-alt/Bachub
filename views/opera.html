<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Materiale pentru bacalaureat — BacHub" />
  <title>Operă — BacHub</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/romana.css" />
  <link rel="stylesheet" href="/css/opera.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="page-hero">
    <div class="hero-inner">
      <div class="hero-top">
        <span class="logo"><a href="/" style="color:white;text-decoration:none;">BacHub</a></span>
        <nav class="nav">
          <a href="/">Acasă</a>
          <a href="/romana" class="active">Română</a>
          <a href="/istorie">Istorie</a>
          <a href="/blog">Blog</a>
          <a href="/despre">Despre</a>
        </nav>
      </div>
      <div class="opera-hero-content">
        <a href="/romana" class="back-link">← Înapoi la Română</a>
        <h1 class="hero-title" id="opera-title">Se încarcă...</h1>
        <p class="hero-subtitle" id="opera-meta"></p>
      </div>
    </div>
  </header>

  <!-- OPERA CONTENT -->
  <div class="opera-layout">

    <!-- SIDEBAR — section navigation -->
    <aside class="opera-sidebar" id="opera-sidebar">
      <div class="sidebar-title">Secțiuni</div>
      <nav id="sidebar-nav"></nav>
    </aside>

   <!-- MAIN CONTENT -->
    <main class="opera-main" id="opera-main">
      <div class="ad-slot" style="margin-bottom: 24px;"><span>Publicitate</span></div>
      <div class="loading">Se încarcă opera...</div>
    </main>

  </div>

  <!-- AD SLOT -->
  <div class="container">
    <div class="ad-slot"><span>Publicitate</span></div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <span class="logo">BacHub</span>
      <p>© 2025 BacHub · Toate drepturile rezervate</p>
      <nav class="footer-nav">
        <a href="/despre">Despre</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/opera.js"></script>
</body>
</html>
